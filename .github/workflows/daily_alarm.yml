name: 안동농협 공판장 일일 시세 알람

on:
  schedule:
    # 한국시간(KST) 월~토 오후 4시, 5시, 6시, 7시 자동 확인 (새 글 올라오면 하루 1번만 발송)
    - cron: '0 0 * * 1-6'
  workflow_dispatch:
    inputs:
      force_test:
        description: '테스트 즉시 발송 (true면 이미 보낸 날짜도 다시 발송)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: pip install requests beautifulsoup4

      - name: 시세 확인 및 휴대폰 알람 발송
        env:
          FORCE_TEST: ${{ github.event.inputs.force_test }}
        run: python alarm.py

      - name: 발송 기록 저장 (중복 알람 방지)
        run: |
          touch last_sent_date.txt
          git config user.name "PriceAlarmBot"
          git config user.email "bot@users.noreply.github.com"
          git add last_sent_date.txt
          git diff --staged --quiet || (git commit -m "Update last sent date" && git push)
